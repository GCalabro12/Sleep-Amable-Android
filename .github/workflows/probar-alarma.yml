name: Probar alarmas en un emulador

on:
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar la versión de pruebas
        run: gradle assembleDebug --no-daemon

      - name: Herramientas de la prueba
        run: pip install websocket-client

      - name: Activar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar alarmas en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: bash prueba/alarma.sh

      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: captura-*.png
