plugins {
    id 'com.android.application'
}

android {
    namespace 'club.practicaintegral.ronquino'
    compileSdk 36

    defaultConfig {
        applicationId 'club.practicaintegral.ronquino'
        minSdk 26
        targetSdk 36 // Google Play pide Android 16 (API 36) para apps nuevas desde el 31-08-2026
        // La compilación automática de GitHub pone el número de versión
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'sin-clave.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'pasos'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lector de códigos de barras de Google Play (alarma reforzada); no necesita permiso de cámara
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Entrar con Google (selector de cuentas de Android)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
